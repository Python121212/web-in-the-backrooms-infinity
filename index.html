<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>web in the backrooms Infinity</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./Texture/icon.png">

    <style>
        /* 画面全体の初期化（スクロール禁止・フルスクリーン） */
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace; /* VHS・レトロ風フォント */
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* 3Dレンダリング用のCanvas */
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        /* UIレイヤー（ゲームオーバー、スタミナ、インベントリなどの親要素） */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 3D側のクリック・タッチを邪魔しない */
            z-index: 10;
        }

        /* ロード画面のスタイリング */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111110;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #e6dfb8; /* Level 0の壁に近いレトロな黄・ベージュ色 */
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #e6dfb8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <div id="uiLayer">
        </div>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; letter-spacing: 2px;">INITIALIZING WEBGPU ENVIRONMENT...</p>
    </div>

    <script type="module">
        // 各種モジュールのインポート（将来的にロジックを関数化してエクスポートする前提）
        // ※ 各jsファイル側で `export default ...` や `export function ...` を使用します。
        import { initializeMap } from './map.js';
        import { initializeUI } from './ui.js';
        import { initializeItems } from './items.js';
        import { initializeEntity } from './entity.js';
        import { initializeVideoRecorder } from './video.js';

        window.addEventListener('DOMContentLoaded', async () => {
            const canvas = document.getElementById('renderCanvas');
            let engine;
            let scene;

            try {
                // 1. WebGPUのサポートチェックと最優先初期化
                if (navigator.gpu && BABYLON.WebGPUEngine.IsSupportedAsync) {
                    engine = new BABYLON.WebGPUEngine(canvas, {
                        antialiasing: true
                    });
                    await engine.initAsync();
                    console.log("Rendering Engine: WebGPU initialized.");
                } else {
                    // WebGPU未対応時のフォールバック（WebGL2）
                    engine = new BABYLON.Engine(canvas, true);
                    console.log("Rendering Engine: WebGL fallback initialized.");
                }

                // 2. Havok 物理エンジンの初期化
                const havokInstance = await HavokPhysics();
                const physicsPlugin = new BABYLON.HavokPlugin(true, havokInstance);

                // 3. 基本となるシーンの作成
                scene = new BABYLON.Scene(engine);
                scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), physicsPlugin);

                // 4. 各グローバル・サブシステムの初期化（依存注入）
                const uiSystem     = initializeUI(scene);
                const itemSystem   = initializeItems(scene);
                const entitySystem = initializeEntity(scene);
                const videoSystem  = initializeVideoRecorder(engine, scene);
                
                // 5. 核心となるマップ生成システムの起動（最初のLevel 0をロード）
                await initializeMap(scene, { uiSystem, itemSystem, entitySystem });

                // ロード画面の非表示
                const loader = document.getElementById('loadingScreen');
                loader.style.opacity = 0;
                setTimeout(() => loader.remove(), 500);

                // 6. メインループの実行
                engine.runRenderLoop(() => {
                    if (scene && scene.activeCamera) {
                        scene.render();
                    }
                });

                // ウィンドウリサイズ対応
                window.addEventListener('resize', () => {
                    engine.resize();
                });

            } catch (error) {
                console.error("Failed to initialize the game environment:", error);
                document.getElementById('loadingScreen').innerHTML = `<p style="color: #ff3333;">ERROR: FAILED TO INITIALIZE WEBGPU/HAVOK.<br>${error.message}</p>`;
            }
        });

        // PWA サービスワーカーの登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker registered: ', reg.scope))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
