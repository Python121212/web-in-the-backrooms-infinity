<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>web in the backrooms Infinity</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./Texture/icon.png">

    <style>
        /* 全画面表示のためのベーススタイル */
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace; /* バックルームズの雰囲気に合わせたフォント */
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Babylon.jsのメインキャンバス */
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        /* ゲームUIのオーバーレイコンテナ（詳細はui.jsで制御） */
        #uiContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 3D空間のクリックを邪魔しない */
            z-index: 10;
        }

        /* ロード画面 */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a11; /* レベル0を意識したくすんだ黄色・カーキ系 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffeedd;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script>
    
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_ammd.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <div id="uiContainer">
        </div>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <p id="loadingText" style="margin-top: 20px; letter-spacing: 2px;">INITIALIZING C.E.L.L. SYSTEM...</p>
    </div>

    <script type="module">
        // PWA サービスワーカーの登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('ServiceWorker registration successful with scope: ', reg.scope);
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }

        // 各種コアモジュールをインポート
        //（拡張性を高めるため、各ファイルは export / import が可能なESモジュール形式を想定しています）
        import { GameManager } from './map.js';
        import { UIManager } from './ui.js';
        import { ItemManager } from './items.js';
        import { EntityManager } from './entity.js';
        import { VideoRecorder } from './video.js';

        window.addEventListener('DOMContentLoaded', async () => {
            const canvas = document.getElementById('renderCanvas');
            
            // WebGPUのサポートチェックと初期化（最優先）
            let engine;
            const isWebGPUSupported = await BABYLON.WebGPUEngine.IsSupportedAsync;
            
            if (isWebGPUSupported) {
                engine = new BABYLON.WebGPUEngine(canvas, {
                    antialiasing: true,
                    preserveDrawingBuffer: true,
                    stencil: true
                });
                await engine.initializeDriversAsync();
                console.log("Rendering Engine: WebGPU");
            } else {
                // フォールバックとしてWebGL2を使用
                engine = new BABYLON.Engine(canvas, true, {
                    preserveDrawingBuffer: true,
                    stencil: true
                });
                console.log("Rendering Engine: WebGL2 (Fallback)");
            }

            // Havok 物理エンジンの初期化
            const havokInstance = await HavokPhysics();
            const hkPhysicsPlugin = new BABYLON.HavokPlugin(true, havokInstance);

            // ゲーム全体のライフサイクル・管理クラスのインスタンス化
            // 将来のMMO化や拡張性を見据え、各マネージャーをグローバルまたは親クラスに紐付けます
            const uiManager = new UIManager();
            const itemManager = new ItemManager();
            const entityManager = new EntityManager();
            const videoRecorder = new VideoRecorder();
            
            // map.jsのGameManagerにすべてを集約し、レベル接続を管理
            const game = new GameManager(engine, canvas, hkPhysicsPlugin, {
                ui: uiManager,
                items: itemManager,
                entity: entityManager,
                video: videoRecorder
            });

            // 初期化・最初のレベル(Level 0)のロード
            await game.init();

            // ロード画面の非表示
            const loadingScreen = document.getElementById('loadingScreen');
            loadingScreen.style.opacity = 0;
            setTimeout(() => loadingScreen.style.display = 'none', 500);

            // ウィンドウサイズ変更への追従
            window.addEventListener('resize', () => {
                engine.resize();
            });
        });
    </script>
</body>
</html>
