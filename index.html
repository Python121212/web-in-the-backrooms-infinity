<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Backrooms Infinity</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d0c07; /* 背景も暗い黄色系に */
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* デバッグオーバーレイ（左上に固定、ui.jsと分離） */
        #debug-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #5e5a32;
            font-family: monospace;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 30;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="debug-overlay">
        <div style="font-size: 16px; font-weight: bold;">The Backrooms Infinity</div>
        <div id="ui-level-name">LEVEL: Loading...</div>
        <div id="ui-coords">Chunk: 0, 0</div>
    </div>

    <script type="module">
        import { Level0 } from './levels/level0.js';
        import { ChunkManager } from './map.js';
        import { UIManager } from './ui.js';

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let scene, camera, chunkManager, uiManager;
        
        const playerState = {
            input: { forward: 0, backward: 0, left: 0, right: 0 },
            mobileMove: { x: 0, z: 0 }, // スマホスティック用ベクトル
            isSprinting: false,
            lean: "none",
            stamina: 100,
            velocity: new BABYLON.Vector3(0, 0, 0),
            isGrounded: true,
            baseSpeed: 0.14,
            sprintSpeed: 0.25,
            currentSpeed: 0.14,
            height: 2.0,
            leanOffset: 0,
            leanAngle: 0,
            targetLeanOffset: 0,
            targetLeanAngle: 0
        };

        const createScene = function () {
            scene = new BABYLON.Scene(engine);
            
            // 暗い黄色演出の適用
            scene.ambientColor = Level0.ambientColor;
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.01, 1);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogColor = Level0.fogColor;
            scene.fogDensity = Level0.fogDensity;

            camera = new BABYLON.UniversalCamera("playerCamera", new BABYLON.Vector3(16, playerState.height, 16), scene);
            camera.attachControl(canvas, true);
            
            camera.keysUp = []; camera.keysDown = []; camera.keysLeft = []; camera.keysRight = [];
            camera.angularSensibility = 1400;

            // 暗い部屋にマッチする、少し弱めた蛍光灯の光
            const topLight = new BABYLON.HemisphericLight("fluorescentLight", new BABYLON.Vector3(0, 1, 0), scene);
            topLight.intensity = 0.45; 
            topLight.diffuse = new BABYLON.Color3(0.9, 0.88, 0.7);

            chunkManager = new ChunkManager(scene, Level0);
            document.getElementById("ui-level-name").innerText = `LEVEL 0: "${Level0.name}"`;

            // UIの初期化と連携
            uiManager = new UIManager({
                onJump: () => { handleJump(); },
                onSprint: (isSprint) => { playerState.isSprinting = isSprint; },
                onLean: (dir) => { handleLean(dir); },
                onStickMove: (x, y) => {
                    // スマホスティックの入力を物理移動用に格納
                    playerState.mobileMove.x = x;
                    playerState.mobileMove.z = y;
                }
            });

            setupKeyboard();

            canvas.addEventListener("click", () => {
                canvas.requestPointerLock();
            });

            return scene;
        };

        function handleJump() {
            if (playerState.isGrounded) {
                playerState.velocity.y = 6.5;
                playerState.isGrounded = false;
            }
        }

        function handleLean(direction) {
            playerState.lean = direction;
            if (direction === "left") {
                playerState.targetLeanOffset = -0.5;
                playerState.targetLeanAngle = 0.07;
            } else if (direction === "right") {
                playerState.targetLeanOffset = 0.5;
                playerState.targetLeanAngle = -0.07;
            } else {
                playerState.targetLeanOffset = 0;
                playerState.targetLeanAngle = 0;
            }
        }

        function setupKeyboard() {
            window.addEventListener("keydown", (e) => {
                const key = e.key.toLowerCase();
                if (key === "w" || e.key === "ArrowUp") playerState.input.forward = 1;
                if (key === "s" || e.key === "ArrowDown") playerState.input.backward = 1;
                if (key === "a" || e.key === "ArrowLeft") playerState.input.left = 1;
                if (key === "d" || e.key === "ArrowRight") playerState.input.right = 1;
                if (e.shiftKey) playerState.isSprinting = true;
                if (key === "q") handleLean("left");
                if (key === "e") handleLean("right");
                if (e.key === " ") handleJump();
            });

            window.addEventListener("keyup", (e) => {
                const key = e.key.toLowerCase();
                if (key === "w" || e.key === "ArrowUp") playerState.input.forward = 0;
                if (key === "s" || e.key === "ArrowDown") playerState.input.backward = 0;
                if (key === "a" || e.key === "ArrowLeft") playerState.input.left = 0;
                if (key === "d" || e.key === "ArrowRight") playerState.input.right = 0;
                if (e.key === "Shift") playerState.isSprinting = false;
                if (key === "q" || key === "e") {
                    if (playerState.lean !== "none") handleLean("none");
                }
            });
        }

        function updatePhysics(deltaTime) {
            // 1. スタミナ処理
            const isMovingKeyboard = playerState.input.forward || playerState.input.backward || playerState.input.left || playerState.input.right;
            const isMovingMobile = playerState.mobileMove.x !== 0 || playerState.mobileMove.z !== 0;
            const isMoving = isMovingKeyboard || isMovingMobile;

            if (playerState.isSprinting && isMoving && playerState.stamina > 0) {
                playerState.currentSpeed = playerState.sprintSpeed;
                playerState.stamina -= 22 * deltaTime;
                if (playerState.stamina < 0) playerState.stamina = 0;
            } else {
                playerState.currentSpeed = playerState.baseSpeed;
                if (!playerState.isSprinting || !isMoving) {
                    playerState.stamina += 18 * deltaTime;
                    if (playerState.stamina > 100) playerState.stamina = 100;
                }
            }
            uiManager.updateStamina(playerState.stamina);

            // 2. 移動方向ベクトルの決定
            const frontVector = camera.getDirection(BABYLON.Vector3.Forward());
            frontVector.y = 0; frontVector.normalize();

            const rightVector = camera.getDirection(BABYLON.Vector3.Right());
            rightVector.y = 0; rightVector.normalize();

            const moveDirection = new BABYLON.Vector3(0, 0, 0);
            
            // PCキーボード入力の合成
            if (playerState.input.forward) moveDirection.addInPlace(frontVector);
            if (playerState.input.backward) moveDirection.subtractInPlace(frontVector);
            if (playerState.input.right) moveDirection.addInPlace(rightVector);
            if (playerState.input.left) moveDirection.subtractInPlace(rightVector);

            // スマホ仮想スティック入力の合成
            if (isMovingMobile) {
                const mobileFront = frontVector.scale(playerState.mobileMove.z);
                const mobileRight = rightVector.scale(playerState.mobileMove.x);
                moveDirection.addInPlace(mobileFront).addInPlace(mobileRight);
            }

            moveDirection.normalize();

            // 3. X/Z独立軸の加算移動
            const moveStep = moveDirection.scale(playerState.currentSpeed);
            if (moveStep.x !== 0) camera.position.x += moveStep.x;
            if (moveStep.z !== 0) camera.position.z += moveStep.z;

            // 4. Y軸重力計算
            if (!playerState.isGrounded) {
                camera.position.y += playerState.velocity.y * deltaTime;
                playerState.velocity.y -= 9.8 * deltaTime;
                if (camera.position.y <= playerState.height) {
                    camera.position.y = playerState.height;
                    playerState.velocity.y = 0;
                    playerState.isGrounded = true;
                }
            }

            // 5. リーンの補間
            playerState.leanOffset += (playerState.targetLeanOffset - playerState.leanOffset) * 0.15;
            playerState.leanAngle += (playerState.targetLeanAngle - playerState.leanAngle) * 0.15;
            camera.rotation.z = playerState.leanAngle;
        }

        scene = createScene();

        engine.runRenderLoop(function () {
            if (scene && camera) {
                const deltaTime = engine.getDeltaTime() / 1000;
                updatePhysics(deltaTime);
                chunkManager.update(camera.position.x, camera.position.z);
                
                const cx = Math.floor(camera.position.x / chunkManager.chunkSize);
                const cz = Math.floor(camera.position.z / chunkManager.chunkSize);
                document.getElementById("ui-coords").innerText = `Chunk: ${cx}, ${cz} | Pos: X:${camera.position.x.toFixed(1)} Z:${camera.position.z.toFixed(1)}`;
                
                scene.render();
            }
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
