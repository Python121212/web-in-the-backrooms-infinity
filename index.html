<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>web in the backrooms Infinity</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./Texture/icon.png">

    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        #uiContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a11;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffeedd;
            z-index: 100;
            transition: opacity 0.5s ease;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script>
    
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_ammd.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>
    <div id="uiContainer"></div>

    <div id="loadingScreen">
        <div class="spinner" id="loadingSpinner"></div>
        <p id="loadingText" style="margin-top: 20px; letter-spacing: 2px; font-size: 16px; word-break: break-all;">INITIALIZING C.E.L.L. SYSTEM...</p>
    </div>

    <script type="module">
        // PWA サービスワーカーの登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
            });
        }

        // コアモジュールのインポート
        import { GameManager } from './map.js';
        import { UIManager } from './ui.js';

        // --- 未実装ファイル用フォールバックモック ---
        // まだ作成していないファイルや、インポートエラーで全体が止まるのを防ぐための安全弁
        class DummyItemManager { onLevelChanged(id){} }
        class DummyEntityManager { onLevelChanged(id){} setChasedStatus(status){} }
        class DummyVideoRecorder {}

        let itemManager = new DummyItemManager();
        let entityManager = new DummyEntityManager();
        let videoRecorder = new DummyVideoRecorder();

        // もしファイルが存在し、読み込みが成功すればそちらに差し替える
        try {
            const itemsMod = await import('./items.js').catch(() => null);
            if (itemsMod && itemsMod.ItemManager) itemManager = new itemsMod.ItemManager();
            
            const entityMod = await import('./entity.js').catch(() => null);
            if (entityMod && entityMod.EntityManager) entityManager = new entityMod.EntityManager();
            
            const videoMod = await import('./video.js').catch(() => null);
            if (videoMod && videoMod.VideoRecorder) videoRecorder = new videoMod.VideoRecorder();
        } catch(e) {
            console.log("一部のオプショナルモジュールはモックを使用します");
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const canvas = document.getElementById('renderCanvas');
            const loadingText = document.getElementById('loadingText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            try {
                let engine;
                loadingText.innerText = "CHECKING GRAPHICS API (WebGPU/WebGL2)...";
                const isWebGPUSupported = await BABYLON.WebGPUEngine.IsSupportedAsync;
                
                if (isWebGPUSupported) {
                    engine = new BABYLON.WebGPUEngine(canvas, {
                        antialiasing: true,
                        preserveDrawingBuffer: true,
                        stencil: true
                    });
                    await engine.initializeDriversAsync();
                    console.log("Rendering Engine: WebGPU");
                } else {
                    engine = new BABYLON.Engine(canvas, true, {
                        preserveDrawingBuffer: true,
                        stencil: true
                    });
                    console.log("Rendering Engine: WebGL2 (Fallback)");
                }

                // Havok 物理エンジンの初期化（スマホで引っかかりやすいポイントのため独立化）
                loadingText.innerText = "LOADING HAVOK PHYSICS ENGINE...";
                let hkPhysicsPlugin = null;
                try {
                    const havokInstance = await HavokPhysics();
                    hkPhysicsPlugin = new BABYLON.HavokPlugin(true, havokInstance);
                } catch(physicsError) {
                    console.warn("Havok Physicsの初期化に失敗しました。物理演算なしで続行します:", physicsError);
                }

                loadingText.innerText = "CONSTRUCTING UI AND SYSTEMS...";
                const uiManager = new UIManager();

                // マネージャーの集約
                const game = new GameManager(engine, canvas, hkPhysicsPlugin, {
                    ui: uiManager,
                    items: itemManager,
                    entity: entityManager,
                    video: videoRecorder
                });

                loadingText.innerText = "GENERATING INFINITY CORE MAP...";
                await game.init();

                // すべて完了したらロード画面を消す
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.style.opacity = 0;
                setTimeout(() => loadingScreen.style.display = 'none', 500);

            } catch (err) {
                // クラッシュした場合は画面上にエラー原因を赤文字で強制表示
                if(loadingSpinner) loadingSpinner.style.display = 'none';
                loadingText.style.color = "#ff3333";
                loadingText.style.fontWeight = "bold";
                loadingText.innerHTML = `CRITICAL ERROR OCCURRED:<br><br><span style="font-size:13px; font-family:monospace; background:rgba(0,0,0,0.5); padding:8px; display:inline-block; border-radius:4px;">${err.stack || err.message || err}</span>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
