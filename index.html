<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Backrooms Infinity</title>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; background-color: #050503; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #debug-overlay {
            position: absolute; top: 15px; left: 15px; color: #5e5a32;
            font-family: monospace; font-size: 13px; pointer-events: none; text-shadow: 1px 1px 2px #000; z-index: 30;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="debug-overlay">
        <div style="font-size: 15px; font-weight: bold;">The Backrooms Infinity</div>
        <div id="ui-level-name">LEVEL: Loading...</div>
        <div id="ui-coords">Chunk: 0, 0</div>
    </div>

    <script type="module">
        import { Level0 } from './levels/level0.js';
        import { ChunkManager } from './map.js';
        import { UIManager } from './ui.js';

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        
        let scene, camera, chunkManager, uiManager;
        let dynamicPointLight, shadowGenerator; // 動的影用ライト
        
        const playerState = {
            input: { forward: 0, backward: 0, left: 0, right: 0 },
            mobileMove: { x: 0, z: 0 },
            // 物理演算用（スピードの慣性）
            velocityXZ: new BABYLON.Vector3(0, 0, 0),
            velocityY: 0,
            friction: 7.5,      // 摩擦係数（高いほど早く止まる）
            acceleration: 35.0, // 加速度力
            
            isSprinting: false,
            lean: "none",
            stamina: 100,
            isGrounded: true,
            baseSpeed: 5.5,
            sprintSpeed: 9.5,
            currentMaxSpeed: 5.5,
            height: 2.0, // 目線の高さ
            leanAngle: 0, targetLeanAngle: 0
        };

        const createScene = function () {
            scene = new BABYLON.Scene(engine);
            
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogColor = Level0.fogColor;
            scene.fogDensity = Level0.fogDensity;
            scene.ambientColor = Level0.ambientColor;

            // 初期位置の壁の高さを4mにしたので、プレイヤーは最初高さ2mに配置
            camera = new BABYLON.UniversalCamera("playerCamera", new BABYLON.Vector3(16, playerState.height, 16), scene);
            camera.attachControl(canvas, true);
            camera.keysUp = []; camera.keysDown = []; camera.keysLeft = []; camera.keysRight = [];
            camera.inputs.remove(camera.inputs.attached.touch);

            // 全体をうっすら照らすベースライト
            const ambientLight = new BABYLON.HemisphericLight("ambientLight", new BABYLON.Vector3(0, 1, 0), scene);
            ambientLight.intensity = 0.15;

            // 【超軽量・影システム】プレイヤー周辺の最寄り蛍光灯にワープする点光源を1つだけ作成
            dynamicPointLight = new BABYLON.PointLight("dynamicFluoLight", new BABYLON.Vector3(0, 3.7, 0), scene);
            dynamicPointLight.intensity = 0.8;
            dynamicPointLight.diffuse = new BABYLON.Color3(1, 0.95, 0.75);
            dynamicPointLight.range = 18; // 光の届く範囲

            // 影生成器の初期化 (マップサイズ 512 で軽量化)
            shadowGenerator = new BABYLON.ShadowGenerator(512, dynamicPointLight);
            shadowGenerator.useBlurExponentialShadowMap = true; // 影のフチを滑らかに
            shadowGenerator.blurKernel = 16;

            chunkManager = new ChunkManager(scene, Level0);
            document.getElementById("ui-level-name").innerText = `LEVEL 0: "${Level0.name}"`;

            uiManager = new UIManager({
                onJump: () => { handleJump(); },
                onSprint: (isSprint) => { playerState.isSprinting = isSprint; },
                onLean: (dir) => { handleLean(dir); },
                onStickMove: (x, y) => { playerState.mobileMove.x = x; playerState.mobileMove.z = y; },
                onLookMove: (mdx, mdy) => {
                    camera.rotation.y += mdx * 0.004;
                    camera.rotation.x += mdy * 0.004;
                    const limit = Math.PI / 2.5;
                    if (camera.rotation.x > limit) camera.rotation.x = limit;
                    if (camera.rotation.x < -limit) camera.rotation.x = -limit;
                }
            });

            setupKeyboard();
            canvas.addEventListener("click", () => { canvas.requestPointerLock(); });

            return scene;
        };

        function handleJump() {
            if (playerState.isGrounded) {
                playerState.velocityY = 5.5;
                playerState.isGrounded = false;
            }
        }

        function handleLean(direction) {
            playerState.lean = direction;
            if (direction === "left") playerState.targetLeanAngle = 0.06;
            else if (direction === "right") playerState.targetLeanAngle = -0.06;
            else playerState.targetLeanAngle = 0;
        }

        function setupKeyboard() {
            window.addEventListener("keydown", (e) => {
                const key = e.key.toLowerCase();
                if (key === "w") playerState.input.forward = 1;
                if (key === "s") playerState.input.backward = 1;
                if (key === "a") playerState.input.left = 1;
                if (key === "d") playerState.input.right = 1;
                if (e.shiftKey) playerState.isSprinting = true;
                if (key === "q") handleLean("left");
                if (key === "e") handleLean("right");
                if (e.key === " ") handleJump();
            });

            window.addEventListener("keyup", (e) => {
                const key = e.key.toLowerCase();
                if (key === "w") playerState.input.forward = 0;
                if (key === "s") playerState.input.backward = 0;
                if (key === "a") playerState.input.left = 0;
                if (key === "d") playerState.input.right = 0;
                if (e.key === "Shift") playerState.isSprinting = false;
                if (key === "q" || key === "e") handleLean("none");
            });
        }

        // 最も近い蛍光灯を探して影の光源を移動させる軽量アルゴリズム
        function updateDynamicLighting() {
            let closestLightPos = null;
            let minDistance = Infinity;

            for (let lightPos of chunkManager.allLights) {
                let dist = BABYLON.Vector3.DistanceSquared(camera.position, lightPos);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestLightPos = lightPos;
                }
            }

            if (closestLightPos) {
                // 最寄りの蛍光灯の真下に点光源をワープさせる
                dynamicPointLight.position.copyFrom(closestLightPos);
            }

            // 影を落とす対象（Caster）を動的に再登録
            shadowGenerator.getShadowMap().renderList = [];
            for (let wallMesh of chunkManager.shadowCasters) {
                if (wallMesh) shadowGenerator.getShadowMap().renderList.push(wallMesh);
            }
        }

        function updatePhysics(deltaTime) {
            // 1. スタミナと速度上限設定
            const isMovingKeyboard = playerState.input.forward || playerState.input.backward || playerState.input.left || playerState.input.right;
            const isMovingMobile = playerState.mobileMove.x !== 0 || playerState.mobileMove.z !== 0;
            const isMoving = isMovingKeyboard || isMovingMobile;

            if (playerState.isSprinting && isMoving && playerState.stamina > 0) {
                playerState.currentMaxSpeed = playerState.sprintSpeed;
                playerState.stamina -= 22 * deltaTime;
            } else {
                playerState.currentMaxSpeed = playerState.baseSpeed;
                if (!isMoving && playerState.stamina < 100) playerState.stamina += 15 * deltaTime;
            }
            uiManager.updateStamina(playerState.stamina);

            // 2. 移動方向入力ベクトルの算出
            const frontVector = camera.getDirection(BABYLON.Vector3.Forward()); frontVector.y = 0; frontVector.normalize();
            const rightVector = camera.getDirection(BABYLON.Vector3.Right()); rightVector.y = 0; rightVector.normalize();

            const inputDir = new BABYLON.Vector3(0, 0, 0);
            if (playerState.input.forward) inputDir.addInPlace(frontVector);
            if (playerState.input.backward) inputDir.subtractInPlace(frontVector);
            if (playerState.input.right) inputDir.addInPlace(rightVector);
            if (playerState.input.left) inputDir.subtractInPlace(rightVector);

            if (isMovingMobile) {
                const mobileFront = frontVector.scale(playerState.mobileMove.z);
                const mobileRight = rightVector.scale(playerState.mobileMove.x);
                inputDir.addInPlace(mobileFront).addInPlace(mobileRight);
            }
            inputDir.normalize();

            // 3. 【慣性処理】 加速度と摩擦による滑らかなスピード増減
            if (isMoving) {
                // 入力方向へ加速
                playerState.velocityXZ.x += inputDir.x * playerState.acceleration * deltaTime;
                playerState.velocityXZ.z += inputDir.z * playerState.acceleration * deltaTime;
            }

            // 摩擦（ブレーキ抵抗）の適用
            playerState.velocityXZ.x -= playerState.velocityXZ.x * playerState.friction * deltaTime;
            playerState.velocityXZ.z -= playerState.velocityXZ.z * playerState.friction * deltaTime;

            // 最高速度のクランプ制限
            const speed = Math.sqrt(playerState.velocityXZ.x * playerState.velocityXZ.x + playerState.velocityXZ.z * playerState.velocityXZ.z);
            if (speed > playerState.currentMaxSpeed) {
                playerState.velocityXZ.x = (playerState.velocityXZ.x / speed) * playerState.currentMaxSpeed;
                playerState.velocityXZ.z = (playerState.velocityXZ.z / speed) * playerState.currentMaxSpeed;
            }

            // カメラ位置へ座標反映
            camera.position.x += playerState.velocityXZ.x * deltaTime;
            camera.position.z += playerState.velocityXZ.z * deltaTime;

            // 4. 垂直方向（ジャンプ・重力）
            if (!playerState.isGrounded) {
                camera.position.y += playerState.velocityY * deltaTime;
                playerState.velocityY -= 12.0 * deltaTime; // 重力加速度
                if (camera.position.y <= playerState.height) {
                    camera.position.y = playerState.height;
                    playerState.velocityY = 0;
                    playerState.isGrounded = true;
                }
            }

            // 5. 左右リーン
            playerState.leanAngle += (playerState.targetLeanAngle - playerState.leanAngle) * 0.15;
            camera.rotation.z = playerState.leanAngle;
        }

        scene = createScene();

        engine.runRenderLoop(function () {
            if (scene && camera) {
                const deltaTime = Math.min(engine.getDeltaTime() / 1000, 0.1); // フレーム落ち時の跳ね防止クランプ
                
                updatePhysics(deltaTime);
                chunkManager.update(camera.position.x, camera.position.z);
                updateDynamicLighting(); // 動的ライト＆シャドウの更新
                
                const cx = Math.floor(camera.position.x / chunkManager.chunkSize);
                const cz = Math.floor(camera.position.z / chunkManager.chunkSize);
                document.getElementById("ui-coords").innerText = `Chunk: ${cx}, ${cz} | Pos: X:${camera.position.x.toFixed(1)} Z:${camera.position.z.toFixed(1)}`;
                
                scene.render();
            }
        });

        window.addEventListener("resize", function () { engine.resize(); });
    </script>
</body>
</html>
